<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Plan road trips within Java and compare cost and travel time for car, motorcycle, train and bus." />
		<meta name="theme-color" content="#0f766e" />
		<title>TripCalc — Java Trip Cost Planner</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180x180.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script>
			// Apply the theme before first paint to avoid a flash.
			(function () {
				try {
					var m = localStorage.getItem('lajur:v1:theme');
					var dark =
						m === 'dark' ||
						(m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) {
						document.documentElement.classList.add('dark');
						document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1220');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
